<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smartwatch rating predictor</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171b;
    --panel-2: #1b1f24;
    --border: #262b31;
    --text: #e7e9ea;
    --text-muted: #8a9099;
    --accent: #35d0a0;
    --accent-dim: #1e6e56;
    --danger: #e2564f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 620px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 14px; margin: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--text-muted); }
  input, select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent-dim); }

  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
  }
  .toggle-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(53, 208, 160, 0.08);
  }

  button.submit {
    width: 100%;
    margin-top: 22px;
    padding: 12px 0;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #062a20;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.submit:hover { background: #2fc094; }

  .result {
    margin-top: 20px;
    padding: 20px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--panel-2);
    display: none;
  }
  .result.show { display: block; }
  .rating-display { display: flex; align-items: baseline; gap: 10px; }
  .rating-number { font-size: 40px; font-weight: 700; color: var(--accent); }
  .rating-scale { font-size: 14px; color: var(--text-muted); }
  .rating-bar-track {
    margin-top: 12px;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
  }
  .rating-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .note { margin-top: 16px; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Smartwatch rating predictor</h1>
    <p class="sub">Enter specs, get an estimated customer rating out of 5.</p>
  </header>

  <div class="panel">
    <form id="predict-form">
      <div class="grid">
        <div class="field">
          <label for="brand">Brand</label>
          <input id="brand" required placeholder="e.g. noise" />
        </div>
        <div class="field">
          <label for="current-price">Current price</label>
          <input id="current-price" type="number" required min="1" placeholder="2999" />
        </div>

        <div class="field">
          <label for="original-price">Original price</label>
          <input id="original-price" type="number" required min="1" placeholder="4999" />
        </div>
        <div class="field">
          <label for="dial-shape">Dial shape</label>
          <select id="dial-shape" required>
            <option value="Circle">Circle</option>
            <option value="Rectangle">Rectangle</option>
            <option value="Square">Square</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="strap-color">Strap color</label>
          <input id="strap-color" required placeholder="e.g. Black" />
        </div>
        <div class="field">
          <label for="strap-material">Strap material</label>
          <select id="strap-material" required>
            <option value="Silicon">Silicon</option>
            <option value="Rubber">Rubber</option>
            <option value="Stainless Steel">Stainless steel</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="weight">Weight</label>
          <select id="weight">
            <option value="">Unknown</option>
            <option value="<= 20 g">Up to 20 g</option>
            <option value="20 - 35 g">20-35 g</option>
            <option value="35 - 50 g">35-50 g</option>
            <option value="50 - 75 g">50-75 g</option>
            <option value="75g +">75 g and up</option>
          </select>
        </div>
        <div class="field">
          <label for="battery-life">Battery life (days)</label>
          <input id="battery-life" type="number" required min="0" placeholder="7" />
        </div>

        <div class="field">
          <label for="display-size">Display size (inches)</label>
          <input id="display-size" type="number" step="0.1" required min="0.1" max="3" placeholder="1.8" />
        </div>
        <div class="field"></div>

        <div class="field">
          <label>Touchscreen</label>
          <div class="toggle-row" id="touchscreen-toggle">
            <button type="button" class="toggle-btn active" data-value="1">Yes</button>
            <button type="button" class="toggle-btn" data-value="0">No</button>
          </div>
        </div>
        <div class="field">
          <label>Bluetooth</label>
          <div class="toggle-row" id="bluetooth-toggle">
            <button type="button" class="toggle-btn active" data-value="1">Yes</button>
            <button type="button" class="toggle-btn" data-value="0">No</button>
          </div>
        </div>
      </div>

      <button type="submit" class="submit">Predict rating</button>
    </form>

    <div class="result" id="result">
      <div class="rating-display">
        <span class="rating-number" id="rating-number">-</span>
        <span class="rating-scale">/ 5.0</span>
      </div>
      <div class="rating-bar-track">
        <div class="rating-bar-fill" id="rating-bar" style="width: 0%"></div>
      </div>
    </div>

    <p class="note">Estimate based on historical smartwatch listings and their customer ratings. Not a guarantee of actual review outcomes.</p>
  </div>
</div>

<script>
  // ---- Trained model, baked in. No server, no Python, no network call. ----
  // Extracted from the real trained Lasso model + its scaler, combined into
  // a single closed-form linear formula: rating = intercept + sum(weight_i * feature_i)
  const MODEL = {
    "intercept": 4.09141578770296,
    "weights": {
      "Current Price": 0.0,
      "Original Price": 7.463222881201141e-06,
      "Discount Percentage": -0.0031769329915687415,
      "Number OF Ratings": 0.05242293341346711,
      "Battery Life (Days)": 0.0,
      "Display Size": 0.003165418139079774,
      "Weight_missing": -0.015480383162146989,
      "Brand_freq": -0.0,
      "Strap_Color_freq": -0.10994570247167043,
      "Weight_ordinal": -0.010872249217631995,
      "reviews_placeholder_flag": 0.0,
      "Touchscreen": -0.08442545968614905,
      "Bluetooth": -0.21720900358137554,
      "Dial Shape_Missing": -0.0,
      "Dial Shape_Other": -0.0,
      "Dial Shape_Rectangle": 0.0,
      "Dial Shape_Square": 0.05721227686808036,
      "Strap Material_Missing": -0.0235165956870277,
      "Strap Material_Other": 0.0,
      "Strap Material_Rubber": 0.012087862204476402,
      "Strap Material_Silicon": 0.0,
      "Strap Material_Stainless Steel": -0.11668173500240969
    },
    "brand_freq_map": {
      "Other": 0.12274368231046931, "noise": 0.10469314079422383, "pebble": 0.09747292418772563,
      "fire-boltt": 0.09747292418772563, "zebronics": 0.09025270758122744, "garmin": 0.08664259927797834,
      "samsung": 0.08303249097472924, "boat": 0.07942238267148015, "gizmore": 0.07220216606498195,
      "dizo": 0.061371841155234655, "huawei": 0.036101083032490974, "fossil": 0.02888086642599278,
      "apple": 0.021660649819494584, "fitbit": 0.018050541516245487
    },
    "strap_color_freq_map": {
      "Black": 0.30324909747292417, "Missing": 0.2888086642599278, "Other": 0.24187725631768953,
      "Grey": 0.09025270758122744, "Blue": 0.07581227436823104
    },
    "default_brand_freq": 0.018050541516245487,
    "default_strap_color_freq": 0.07581227436823104,
    "weight_order": ["<= 20 g", "20 - 35 g", "35 - 50 g", "50 - 75 g", "75g +"],
    "weight_mode": "20 - 35 g"
  };

  function setupToggle(id) {
    const group = document.getElementById(id);
    group.addEventListener('click', (e) => {
      const btn = e.target.closest('.toggle-btn');
      if (!btn) return;
      group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  }
  setupToggle('touchscreen-toggle');
  setupToggle('bluetooth-toggle');

  function getToggleValue(id) {
    return Number(document.querySelector(`#${id} .toggle-btn.active`).dataset.value);
  }

  function lookupFreq(map, key, fallback) {
    const match = Object.keys(map).find(k => k.toLowerCase() === String(key).trim().toLowerCase());
    return match ? map[match] : fallback;
  }

  function predict(raw) {
    const currentPrice = raw.currentPrice;
    const originalPrice = raw.originalPrice;
    const discountPct = raw.discountPct;
    const numRatingsLog = 0; // brand-new listing assumed, log1p(0) = 0

    const weightValue = raw.weight || MODEL.weight_mode;
    const weightMissing = raw.weight ? 0 : 1;
    const weightOrdinal = MODEL.weight_order.indexOf(weightValue);

    const brandFreq = lookupFreq(MODEL.brand_freq_map, raw.brand, MODEL.default_brand_freq);
    const strapColorFreq = lookupFreq(MODEL.strap_color_freq_map, raw.strapColor, MODEL.default_strap_color_freq);

    const features = {
      "Current Price": 0,
      "Original Price": originalPrice,
      "Discount Percentage": discountPct,
      "Number OF Ratings": numRatingsLog,
      "Battery Life (Days)": raw.batteryLife,
      "Display Size": raw.displaySize,
      "Weight_missing": weightMissing,
      "Brand_freq": brandFreq,
      "Strap_Color_freq": strapColorFreq,
      "Weight_ordinal": weightOrdinal,
      "reviews_placeholder_flag": 0,
      "Touchscreen": raw.touchscreen,
      "Bluetooth": raw.bluetooth,
      "Dial Shape_Missing": raw.dialShape === "Missing" ? 1 : 0,
      "Dial Shape_Other": raw.dialShape === "Other" ? 1 : 0,
      "Dial Shape_Rectangle": raw.dialShape === "Rectangle" ? 1 : 0,
      "Dial Shape_Square": raw.dialShape === "Square" ? 1 : 0,
      "Strap Material_Missing": raw.strapMaterial === "Missing" ? 1 : 0,
      "Strap Material_Other": raw.strapMaterial === "Other" ? 1 : 0,
      "Strap Material_Rubber": raw.strapMaterial === "Rubber" ? 1 : 0,
      "Strap Material_Silicon": raw.strapMaterial === "Silicon" ? 1 : 0,
      "Strap Material_Stainless Steel": raw.strapMaterial === "Stainless Steel" ? 1 : 0,
    };

    let rating = MODEL.intercept;
    for (const [name, value] of Object.entries(features)) {
      rating += MODEL.weights[name] * value;
    }

    return Math.max(1, Math.min(5, rating));
  }

  const form = document.getElementById('predict-form');
  const resultBox = document.getElementById('result');
  const ratingNumber = document.getElementById('rating-number');
  const ratingBar = document.getElementById('rating-bar');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const raw = {
      brand: document.getElementById('brand').value.trim(),
      currentPrice: Number(document.getElementById('current-price').value),
      originalPrice: Number(document.getElementById('original-price').value),
      dialShape: document.getElementById('dial-shape').value,
      strapColor: document.getElementById('strap-color').value.trim(),
      strapMaterial: document.getElementById('strap-material').value,
      weight: document.getElementById('weight').value,
      batteryLife: Number(document.getElementById('battery-life').value),
      displaySize: Number(document.getElementById('display-size').value),
      touchscreen: getToggleValue('touchscreen-toggle'),
      bluetooth: getToggleValue('bluetooth-toggle'),
    };

    if (raw.currentPrice > raw.originalPrice) {
      alert("Current price can't be higher than original price.");
      return;
    }

    const rating = predict(raw);
    ratingNumber.textContent = rating.toFixed(2);
    ratingBar.style.width = `${(rating / 5) * 100}%`;
    resultBox.classList.add('show');
  });
</script>
</body>
</html>
